name: Keep Supabase Alive

# Supabase pauses free-tier projects after 7 days with no API activity.
# This used to run twice a week, which left almost no margin: GitHub does
# not guarantee scheduled workflows fire on time -- cron runs, especially
# ones scheduled for a "popular" time like the top of the hour, can be
# delayed or occasionally dropped under load. One skipped run at a
# twice-weekly cadence was enough to blow past the 7-day window and let the
# project pause anyway. Running every 6 hours, at an off-peak minute, gives
# a wide margin even if several runs in a row get dropped.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, offset from the top of the hour
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf --retry 3 --retry-delay 5 "$SUPABASE_URL/rest/v1/settings?select=shop_name&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
