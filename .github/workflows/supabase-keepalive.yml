name: Keep Supabase Alive

# Supabase pauses free-tier projects after 7 days with no API activity.
# This pings the REST API twice a week, well inside that window.
on:
  schedule:
    - cron: "0 6 * * 1,4" # Monday and Thursday, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf "$SUPABASE_URL/rest/v1/settings?select=shop_name&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
